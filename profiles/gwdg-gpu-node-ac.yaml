# profiles/gwdg-gpu-node-ac.yaml
#
# Study 2026-09-gwdg-gate (studies/gwdg-gate/PREREGISTRATION.md), arm `AC`: Family A and Family C
# (the seven-signal joint vector) on the GWDG GPU node telemetry dataset. See gwdg-gpu-node-a.yaml
# for what the profile is and is not. The A:C split is the llm-inference-streaming ratio, 2:1.
#
# Root profile (no `extends:`).

id: gwdg-gpu-node-ac
version: "1.0.0"
extends: null
description: >
  Study 2026-09-gwdg-gate arm AC: Family A (6e-4) and Family C (4e-4) on seven DCGM per-GPU
  signals, α_total 1e-3. Structural rules, Families D and E off.

sli_list:
  - signal: DCGM_FI_DEV_GPU_TEMP
    direction_of_better: lower
    δ_min: 0.05
  - signal: DCGM_FI_DEV_MEMORY_TEMP
    direction_of_better: lower
    δ_min: 0.05
  - signal: DCGM_FI_DEV_POWER_USAGE
    direction_of_better: lower
    δ_min: 0.05
  - signal: DCGM_FI_DEV_GPU_UTIL
    direction_of_better: higher
    δ_min: 0.05
  - signal: DCGM_FI_DEV_MEM_COPY_UTIL
    direction_of_better: higher
    δ_min: 0.05
  - signal: DCGM_FI_DEV_SM_CLOCK
    direction_of_better: higher
    δ_min: 0.05
  - signal: DCGM_FI_DEV_MEM_CLOCK
    direction_of_better: higher
    δ_min: 0.05

family_a_rollback_signals:
  - DCGM_FI_DEV_GPU_TEMP
  - DCGM_FI_DEV_MEMORY_TEMP
  - DCGM_FI_DEV_POWER_USAGE
  - DCGM_FI_DEV_GPU_UTIL
  - DCGM_FI_DEV_MEM_COPY_UTIL
  - DCGM_FI_DEV_SM_CLOCK
  - DCGM_FI_DEV_MEM_CLOCK

structural_detectors:
  enabled: false
  dependencies: []

joint_vector:
  signals:
    - DCGM_FI_DEV_GPU_TEMP
    - DCGM_FI_DEV_MEMORY_TEMP
    - DCGM_FI_DEV_POWER_USAGE
    - DCGM_FI_DEV_GPU_UTIL
    - DCGM_FI_DEV_MEM_COPY_UTIL
    - DCGM_FI_DEV_SM_CLOCK
    - DCGM_FI_DEV_MEM_CLOCK
  include_in_family_c: true
  include_in_family_e: false

alpha_allocation:
  per_family:
    A: 6.0e-4
    B: 0.0
    C: 4.0e-4
    D: 0.0
    E: 0.0
  total: 1.0e-3

cell_dimensions:
  hour_of_day: true
  day_of_week: false
  workload_class: false
  tenant_tier: false
  region: false

bake_profiles: []

policy_defaults:
  reversibility_threshold_minutes: 30
  auto_rollback_enabled: true
  default_risk_tier: medium
