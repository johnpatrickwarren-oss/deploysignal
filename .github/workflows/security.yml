name: Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['ws*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high+ severity)
        run: npm audit --audit-level=high

      - name: Run npm audit (informational, all levels)
        if: always()
        run: npm audit || true
